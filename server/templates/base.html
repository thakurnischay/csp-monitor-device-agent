<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CSP Device Monitor{% endblock %}</title>
<style>
  :root { --ok:#1a7f37; --bad:#c62828; --muted:#888; --line:#e2e2e2; --accent:#2563eb; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f7f7f8; color: #1a1a1a; }
  nav { background: #16181d; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
  nav a { color: #cfd3da; text-decoration: none; margin-left: 16px; }
  nav a:hover { color: #fff; }
  main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 1.4rem; }
  .cards { display: flex; gap: 16px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px; flex: 1; }
  .card .v { font-size: 1.6rem; font-weight: 700; }
  .card .l { color: var(--muted); font-size: 0.85rem; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
  th { background: #fafafa; color: var(--muted); font-weight: 600; }
  a.row { color: var(--accent); text-decoration: none; font-weight: 600; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 0.78rem; color: #fff; }
  .pill.ok { background: var(--ok); } .pill.bad { background: var(--bad); } .pill.off { background: var(--muted); }
  .note { color: var(--muted); font-size: 0.85rem; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; }
  .flash { background: #fff8db; border: 1px solid #e8d98a; padding: 8px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 0.9rem; }
  form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  input, button { padding: 6px 10px; font-size: 0.9rem; }
  button { cursor: pointer; }
</style>
</head>
<body>
<nav>
  <strong>CSP Device Monitor</strong>
  <div>
    <a href="{{ url_for('ui.fleet') }}">Fleet</a>
    <a href="{{ url_for('ui.api_keys') }}">API Keys</a>
    <a href="{{ url_for('ui.logout') }}">Logout</a>
  </div>
</nav>
<main>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
