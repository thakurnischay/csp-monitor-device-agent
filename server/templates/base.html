<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CSP Device Monitor{% endblock %}</title>
<style>
  :root {
    --ok:#16a34a; --ok-bg:#dcfce7; --ok-text:#166534;
    --amber:#d97706; --amber-bg:#fef3c7; --amber-text:#92400e;
    --bad:#dc2626; --bad-bg:#fee2e2; --bad-text:#991b1b;
    --gray-bg:#f1f5f9; --gray-text:#475569; --gray-dot:#94a3b8;
    --muted:#64748b; --border:#e2e8f0; --accent:#e07b13;
    --ink:#0f172a; --surface:#ffffff; --canvas:#f8fafc;
    --radius:12px; --shadow:0 1px 2px rgba(15,23,42,0.04), 0 1px 1px rgba(15,23,42,0.03);
    --brand-teal:#0b5563; --brand-teal-dark:#083f4a; --brand-orange:#f5a623;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; margin: 0; background: var(--canvas); color: var(--ink); }
  main { max-width: 1120px; margin: 28px auto; padding: 0 20px; }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  a { color: var(--accent); }

  /* ---------- top nav ---------- */
  nav { background: var(--brand-teal); color: #fff; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; height: 56px; }
  nav .brand { display: flex; align-items: center; gap: 10px; }
  .eko-logo { display: flex; flex-direction: column; line-height: 1; }
  .eko-logo .eko { display: inline-flex; align-items: center; color: var(--brand-orange); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; }
  .eko-o { display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; border: 0.17em solid currentColor; margin-left: 0.06em; }
  .eko-logo .kiosk { color: #eaf4f5; font-weight: 700; font-size: 0.52rem; letter-spacing: 0.14em; margin-top: 1px; }
  .brand-sub { color: #a9d3d8; font-size: 0.75rem; font-weight: 500; padding-left: 10px; margin-left: 2px; border-left: 1px solid rgba(255,255,255,0.25); }
  .navlinks { display: flex; align-items: center; gap: 4px; height: 100%; }
  .navlinks a { color: #a9d3d8; text-decoration: none; font-size: 0.86rem; font-weight: 500; padding: 6px 12px; border-radius: 7px; transition: background .12s, color .12s; }
  .navlinks a:hover { color: #fff; background: rgba(255,255,255,0.08); }
  .navlinks a.active { color: #fff; background: rgba(255,255,255,0.16); }
  .nav-right { display: flex; align-items: center; gap: 14px; }
  .user-badge { display: flex; align-items: center; gap: 8px; color: #d4ecee; font-size: 0.82rem; font-weight: 500; }
  .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--brand-teal-dark); display: flex; align-items: center; justify-content: center; color: #d4ecee; flex-shrink: 0; }
  .avatar svg { width: 14px; height: 14px; }

  /* ---------- buttons ---------- */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: 1px solid transparent; text-decoration: none; line-height: 1.2; white-space: nowrap; transition: background .12s, border-color .12s, color .12s; }
  .btn-primary { background: var(--brand-orange); color: #ffffff; }
  .btn-primary:hover { background: #e2950f; }
  .btn-outline { background: var(--surface); color: var(--ink); border-color: var(--border); }
  .btn-outline:hover { background: var(--canvas); }
  .btn-danger { background: var(--bad); color: #fff; }
  .btn-danger:hover { background: #b91c1c; }
  .btn-sm { padding: 6px 11px; font-size: 0.78rem; }
  .btn svg { flex-shrink: 0; }

  /* ---------- KPI cards ---------- */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin: 18px 0 20px; }
  .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .kpi-card.tint-bad { background: #fef2f2; border-color: #fecaca; }
  .kpi-card.tint-amber { background: #fffbeb; border-color: #fde68a; }
  .kpi-card.tint-ok { background: #f0fdf4; border-color: #bbf7d0; }
  .kpi-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .kpi-icon.ok { color: var(--ok); }
  .kpi-icon.amber { color: var(--amber); }
  .kpi-icon.bad { color: var(--bad); }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; }
  .kpi-dot { width: 8px; height: 8px; border-radius: 50%; }
  .kpi-dot.ok { background: var(--ok); } .kpi-dot.amber { background: var(--amber); } .kpi-dot.bad { background: var(--bad); }
  .kpi-value { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; }
  .kpi-label { color: var(--muted); font-size: 0.82rem; font-weight: 500; display: flex; align-items: center; gap: 6px; }

  /* ---------- toolbar ---------- */
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 16px; }
  .search-wrap { position: relative; flex: 1 1 220px; min-width: 180px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #94a3b8; pointer-events: none; }
  .search-wrap input { padding-left: 32px; width: 100%; }
  .toggle-label { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 0.85rem; color: var(--ink); cursor: pointer; user-select: none; }
  .switch { position: relative; display: inline-block; width: 34px; height: 19px; flex-shrink: 0; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .track { position: absolute; inset: 0; background: #cbd5e1; border-radius: 999px; transition: background .15s; }
  .switch .track::before { content: ""; position: absolute; width: 15px; height: 15px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::before { transform: translateX(15px); }

  /* ---------- segmented control (auto-refresh) ---------- */
  .segmented { display: inline-flex; background: var(--gray-bg); border-radius: 999px; padding: 3px; gap: 2px; }
  .segmented a { padding: 5px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; color: var(--muted); text-decoration: none; }
  .segmented a.active { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(15,23,42,.08); }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 5px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* ---------- badges / status pills ---------- */
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 0.76rem; font-weight: 600; white-space: nowrap; }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .badge-green { background: var(--ok-bg); color: var(--ok-text); } .badge-green .dot { background: var(--ok); }
  .badge-amber { background: var(--amber-bg); color: var(--amber-text); } .badge-amber .dot { background: var(--amber); }
  .badge-red { background: var(--bad-bg); color: var(--bad-text); } .badge-red .dot { background: var(--bad); }
  .badge-gray { background: var(--gray-bg); color: var(--gray-text); } .badge-gray .dot { background: var(--gray-dot); }

  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 0.86rem; }
  th { background: var(--canvas); color: var(--muted); font-weight: 600; font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.03em; }
  th a { color: inherit; text-decoration: none; }
  th a:hover { color: var(--ink); }
  tbody tr:hover { background: var(--canvas); }
  tbody tr:last-child td { border-bottom: none; }
  a.row { color: var(--accent); text-decoration: none; font-weight: 600; }
  .note { color: var(--muted); font-size: 0.85rem; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 16px; }
  .flash { background: #fff8db; border: 1px solid #e8d98a; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 0.88rem; }
  form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 0; }
  input, select, button { padding: 8px 11px; font-size: 0.86rem; border: 1px solid var(--border); border-radius: 8px; background: #fff; font-family: inherit; }
  button { cursor: pointer; }
  label { font-size: 0.82rem; font-weight: 600; color: var(--ink); }

  /* ---------- copy-to-clipboard ---------- */
  .copy-btn { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: var(--muted); cursor: pointer; vertical-align: middle; margin-left: 6px; }
  .copy-btn:hover { background: var(--canvas); color: var(--ink); }
  .copy-btn.copied { color: var(--ok); border-color: var(--ok-bg); }
  code.keyval { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 0.86rem; }
</style>
</head>
<body>
<nav>
  <div class="brand">
    <div class="eko-logo"><span class="eko">ek<span class="eko-o"></span></span><span class="kiosk">KIOSK</span></div>
    <span class="brand-sub">CSP Device Monitor</span>
  </div>
  <div class="navlinks">
    <a href="{{ url_for('ui.fleet') }}" class="{{ 'active' if request.endpoint == 'ui.fleet' }}">Fleet</a>
    <a href="{{ url_for('ui.api_keys') }}" class="{{ 'active' if request.endpoint == 'ui.api_keys' }}">API Keys</a>
    <a href="{{ url_for('ui.audit_log') }}" class="{{ 'active' if request.endpoint == 'ui.audit_log' }}">Audit Log</a>
  </div>
  <div class="nav-right">
    {% if session.get('admin_login') %}
    <div class="user-badge">
      <span class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg></span>
      {{ session.get('admin_login') }}
    </div>
    {% endif %}
    <a href="{{ url_for('ui.logout') }}" class="btn btn-outline btn-sm" style="background:transparent;border-color:#2a7480;color:#eaf4f5">Logout</a>
  </div>
</nav>
<main>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
