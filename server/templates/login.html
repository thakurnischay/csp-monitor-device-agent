<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - CSP Device Monitor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
         background: linear-gradient(160deg, var(--brand) 0%, var(--brand-darker) 100%); }
  .login { width: 100%; max-width: 380px; }
  .login-brand { display: flex; align-items: center; gap: 12px; color: #fff; margin-bottom: 20px; justify-content: center; }
  .login-brand strong { font-size: 1.05rem; } .login-brand span { display: block; color: #8FC3C9; font-size: 0.78rem; }
  .box { background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .box h1 { font-size: 1.25rem; margin-bottom: 4px; }
  .box p { color: var(--muted); margin: 0 0 20px; font-size: 0.86rem; }
  .field { margin-bottom: 14px; } .field label { display: block; margin-bottom: 6px; }
  .field input { width: 100%; min-height: 40px; }
  .box .btn { width: 100%; min-height: 42px; font-size: 0.9rem; }
  .flash { background: var(--bad-bg); border-color: #FECACA; color: var(--bad-text); }
</style>
</head>
<body>
<div class="login">
  <div class="login-brand">
    <span class="logo-box">
      {% set logo = brand_logo() if brand_logo is defined else None %}
      {% if logo %}<img src="{{ logo }}" alt="Eko">
      {% else %}
      <span class="eko-logo" role="img" aria-label="Eko"><span class="eko">ek<svg class="eko-o-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M 18.1 6.9 A 8 8 0 1 1 5.9 6.9" stroke-width="2.6"/><g stroke-width="1.2"><line x1="12" y1="5.2" x2="12" y2="1.5"/><line x1="13.7" y1="5.4" x2="14.6" y2="1.9"/><line x1="10.3" y1="5.4" x2="9.4" y2="1.9"/><line x1="15.3" y1="6.2" x2="17.1" y2="3.1"/><line x1="8.7" y1="6.2" x2="6.9" y2="3.1"/><line x1="16.7" y1="7.4" x2="19.2" y2="5.1"/><line x1="7.3" y1="7.4" x2="4.8" y2="5.1"/></g></svg></span><span class="kiosk">KIOSK</span></span>
      {% endif %}
    </span>
    <div><strong>CSP Device Monitor</strong><span>Operations console</span></div>
  </div>
  <div class="box">
    <h1>Sign in</h1>
    <p>Administrator access only.</p>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash" role="alert">{{ m }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="login_id">Login ID</label><input id="login_id" name="login_id" autocomplete="username" autofocus required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
  </div>
</div>
</body>
</html>
