<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Login - CSP Device Monitor</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f7f7f8; display: flex;
        align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .box { background: #fff; border: 1px solid #e2e2e2; border-radius: 8px; padding: 28px; width: 300px; }
  h1 { font-size: 1.2rem; margin-top: 0; }
  input { width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; }
  button { width: 100%; padding: 8px; cursor: pointer; }
  .flash { background: #fde8e8; border: 1px solid #f0b4b4; padding: 8px; border-radius: 6px;
          margin-bottom: 12px; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="box">
  <h1>CSP Device Monitor — Admin</h1>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <input name="login_id" placeholder="Login ID" autofocus required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Log in</button>
  </form>
</div>
</body>
</html>
